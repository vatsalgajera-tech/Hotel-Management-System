{% load static %}
<!DOCTYPE html>
<head>
    <title>Admin </title>
    <!-- Bootstrap Core CSS -->
    <link href="bower_components/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="bower_components/metisMenu/dist/metisMenu.min.css" rel="stylesheet">
    <link href="dist/css/sb-admin-2.css" rel="stylesheet">
    <link href="bower_components/font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style> 
      .title {
        font-size: 50px;
        text-align: center;
        margin: 50px 456px;
        font-weight: bold;
        color: white;
        text-decoration:none;
        font-family: 'Times New Roman', Times, serif;
        transition: text-shadow 0.3s ease-in-out;
      }
      body {
        background-image: url("{% static 'HotelApp/images/hotel.jpg' %}");
        background-repeat: no-repeat;
        margin: 0;
        background-size: cover;
        background-position: center;
        {% comment %} background-image: linear-gradient(to left, #1565C0, #8E24AA); {% endcomment %}
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("{% static 'HotelApp/images/hotel.jpg' %}") no-repeat center center/cover;
        filter: blur(6px); /* Adjust blur intensity */
        z-index: -1;
    }

    .b {
        background-color:white;
        border-radius: 15px;
        margin: 50px 530px;
        padding: 20px 40px 20px 40px;
        height: auto;
    }

    .c {
        font-size: 27px;
        text-align:center;
        font-family: 'Times New Roman', Times, serif;
    }

    .d {
        font-size: 12px;
    }
    .btn{
        background-color:rgb(255, 220, 21); 
        color: black;
        padding: 5px 80px ;
        text-align: center; 
        display: inline-block;
        font-size: 20px;
        border-radius: 10px;
        border:2px solid orange;
        transition: background-color 0.3s ease;
      }
      
      /* Hover effect */
      .btn:hover {
        color:white;
        border:2px solid rgb(0, 255, 13);
        background-color:rgb(0, 145, 7); /* Darker green on hover */
      }
    </style>
</head>
<body>
    <div style=" margin-top:45px;">
    <a  class="title"href="{% url 'home' %}">CELESTIAL VIEW</a>
    </div>

    <div class=" b">
        <br>
        <p class="c">Welcome Admin!</p>
        <br>
        <form method="post">
            {% csrf_token %}
             <fieldset>
                <div>
                    <p class="d">Username</p>
                    <input class="form-control" placeholder="Enter Username" id="id" name="id" type="text" required autofocus autocomplete="off">
                </div>
                <br>
                <div>
                    <p class="d">Password</p>
                    <input class="form-control" placeholder="Enter Password" id="password" name="password" type="password" value="" required>
                </div>
                <br><br>
               
            </fieldset>  
            
            <input type="submit" value="Login" name="submit" class="btn"><br><br>
            
        </form>
    </div>
</body>
</html>
