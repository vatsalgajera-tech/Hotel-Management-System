{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("{% static 'HotelApp/images/hotel.jpg' %}");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .register-container {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            width: 400px;
            margin: 7px auto;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-custom {
            background-color: rgb(255, 220, 21);
            color: black;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid orange;
            transition: background-color 0.3s ease;
        }

        .btn-custom:hover {
            background-color: rgb(0, 145, 7);
            color: white;
            border: 2px solid rgb(0, 255, 13);
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("{% static 'HotelApp/images/hotel.jpg' %}") no-repeat center center/cover;
            filter: blur(6px); /* Adjust blur intensity */
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h3 class="text-center">User Registration</h3><br>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="first_name" class="form-label">First Name</label>
                <input type="text" class="form-control" id="first_name" name="first_name" required>
            </div>
            <div class="mb-3">
                <label for="last_name" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="last_name" name="last_name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-custom">Register</button>
        </form>
        <p class="text-center mt-3">Already have an account? <a href="{% url 'userlogin' %}">Login Here</a></p>
    </div>
</body>
</html>
